<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <svg class="logo-icon" viewBox="0 0 24 24" width="18" height="18">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="header-title">Page Linker</span>
    </div>
    <button id="btn-settings" class="icon-btn" title="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
              fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </header>

  <!-- Current page info -->
  <div class="current-page" id="current-page">
    <img id="current-favicon" class="favicon" src="" alt="">
    <div class="current-page-text">
      <div id="current-title" class="current-title"></div>
      <div id="current-domain" class="current-domain"></div>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button id="btn-new-group" class="btn btn-primary">
      <svg viewBox="0 0 24 24" width="14" height="14">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      New Group
    </button>
    <button id="btn-add-to-group" class="btn btn-secondary">
      <svg viewBox="0 0 24 24" width="14" height="14">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Add to Group
    </button>
  </div>

  <!-- Search -->
  <div id="search-bar" class="search-bar" style="display: none;">
    <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M21 21l-4.35-4.35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input type="text" id="search-input" class="search-input" placeholder="Search groups...">
  </div>

  <!-- Groups list for current page -->
  <div id="groups-container" class="groups-container">
    <!-- Populated by JS -->
  </div>

  <!-- Empty state -->
  <div id="empty-state" class="empty-state" style="display: none;">
    <svg viewBox="0 0 24 24" width="40" height="40" class="empty-icon">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <p>No link groups for this page yet.</p>
    <p class="empty-hint">Click <strong>New Group</strong> to start linking pages together.</p>
  </div>

  <!-- Modal overlay for creating/adding groups -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">New Group</h3>
        <button id="modal-close" class="icon-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
